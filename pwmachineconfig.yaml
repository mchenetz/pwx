apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: worker
  name: worker-enable-multipathing
spec:
  config:
    ignition:
      version: 3.2.0
    storage:
      files:
        - contents:
            source: data:text/plain;charset=utf-8;base64,
          mode: 420
          overwrite: true
          path: /etc/multipath.conf
    systemd:
      units:
        - name: multipathd.service
          enabled: true
  # The above manifest enables multipathing for FiberChannel connections. To add iSCSI based FlashArray support,
  # uncomment the lines below.
  # - name: iscsid.service
  # enabled: true
